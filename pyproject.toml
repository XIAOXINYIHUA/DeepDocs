[project]
name = "deepdocs"
version = "0.1.0"
description = "全格式、可追溯、DeepSeek 优先的私有文档研究工作台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "dramatiq[redis]>=1.17",
    "qdrant-client>=1.12",
    "minio>=7.2",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "pyjwt>=2.10",
    "passlib>=1.7",
    "bcrypt>=4.0",
    "python-multipart>=0.0.18",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
parsers = [
    "docling>=2.18",
    "PyMuPDF>=1.25",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "lxml>=5.3",
    "paddlepaddle>=3.0",
    "paddleocr>=2.9",
]
providers = [
    "openai>=1.55",
]
bge = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
dev = [
    "deepdocs[parsers,providers,bge,test]",
    "ipython>=8.30",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*", "workers*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
