x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── API ───
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      create_buckets:
        condition: service_completed_successfully
    volumes:
      - ./packages:/app/packages
      - ./models:/app/models
      - ./infra/db:/app/infra/db
      - ./apps:/app/apps
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── 摄取 Worker ───
  worker:
    build:
      context: .
      dockerfile: workers/ingestion/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      create_buckets:
        condition: service_completed_successfully
    volumes:
      - ./packages:/app/packages
      - ./models:/app/models
    restart: unless-stopped
    logging: *logging

  # ─── 数据库 ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deepdocs
      POSTGRES_PASSWORD: deepdocs_secret
      POSTGRES_DB: deepdocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepdocs"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  # ─── 消息队列 ───
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging

  # ─── 向量库 ───
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -q '00000000:18BD ' /proc/net/tcp"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *logging

  # ─── 对象存储 ───
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: deepdocs
      MINIO_ROOT_PASSWORD: deepdocs_secret
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  # ─── MinIO 初始化桶 ───
  create_buckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 deepdocs deepdocs_secret; do sleep 1; done;
      mc mb local/deepdocs-files --ignore-existing;
      mc anonymous set download local/deepdocs-files;
      echo 'Bucket created successfully';
      "
    restart: no
    logging: *logging

  # ─── 可选：PgAdmin ───
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["dev"]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@deepdocs.local
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redis_data:
  qdrant_data:
  qdrant_snapshots:
  minio_data:
  pgadmin_data:
